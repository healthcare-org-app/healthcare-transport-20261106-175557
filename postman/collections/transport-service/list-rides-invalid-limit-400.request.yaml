$kind: http-request
name: List rides - invalid limit (400)
order: 5000
method: GET
url: '{{base_url}}/api/rides?limit=0'
queryParams:
  - key: limit
    value: '0'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 400', () => pm.response.to.have.status(400));
      pm.test('body matches Error schema', () => {
        const b = pm.response.json();
        pm.expect(Object.keys(b)).to.eql(['error']);
        pm.expect(b.error).to.be.a('string').and.not.empty;
      });
